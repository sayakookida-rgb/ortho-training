<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="矯正トレーニング"/>
<title>🦷 矯正トレーニング</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:#f3e8ff;}
body{font-family:-apple-system,sans-serif;overscroll-behavior:none;}
button{font-family:-apple-system,sans-serif;-webkit-appearance:none;cursor:pointer;}
input{font-family:-apple-system,sans-serif;}
#app{max-width:500px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;}
#hdr{background:linear-gradient(135deg,#7b2ff7,#b06eff);padding:24px 18px 18px;color:#fff;}
#hdr-sub{font-size:12px;opacity:.8;margin-bottom:2px;}
#hdr-title{font-size:24px;font-weight:800;}
#prog-box{margin-top:10px;background:rgba(255,255,255,.2);border-radius:12px;padding:10px 14px;}
#prog-date{font-size:12px;opacity:.85;margin-bottom:5px;}
#prog-row{display:flex;align-items:center;gap:10px;}
#prog-bg{flex:1;height:9px;background:rgba(255,255,255,.3);border-radius:9px;overflow:hidden;}
#prog-fill{height:100%;background:#fff;border-radius:9px;width:0%;transition:width .4s;}
#prog-txt{font-size:14px;font-weight:800;}
#tabs{display:flex;background:#fff;border-bottom:2px solid #ede0ff;position:sticky;top:0;z-index:10;}
.tb{flex:1;padding:13px 0;border:none;background:none;font-size:13px;font-weight:600;color:#bbb;border-bottom:3px solid transparent;}
.tb.on{font-weight:800;color:#7b2ff7;border-bottom:3px solid #7b2ff7;}
#content{flex:1;padding:16px 14px 50px;overflow-y:auto;}
.panel{display:flex;flex-direction:column;gap:14px;}
.card{border-radius:20px;padding:18px 16px;position:relative;box-shadow:0 3px 14px rgba(0,0,0,.08);}
.c-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.c-ico{font-size:34px;line-height:1;}
.c-name{font-size:18px;font-weight:800;}
.c-desc{font-size:12px;color:#999;margin-top:1px;}
.badge{position:absolute;top:12px;right:12px;background:#4caf50;color:#fff;border-radius:20px;padding:3px 11px;font-size:11px;font-weight:700;}
.done-box{background:#fff;border-radius:12px;padding:11px 13px;font-size:13px;color:#555;}
.redo{margin-top:8px;padding:4px 12px;border-radius:16px;border:1px solid #ddd;background:#fff;color:#aaa;font-size:11px;cursor:pointer;}
.btn-start{width:100%;padding:13px;border-radius:14px;border:none;color:#fff;font-size:15px;font-weight:800;cursor:pointer;}
.btn-save{width:100%;padding:13px;border-radius:14px;border:none;color:#fff;font-size:15px;font-weight:800;margin-top:10px;cursor:pointer;}
.guide{width:100%;border-radius:16px;padding:16px;text-align:center;min-height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;}
.g-emoji{font-size:40px;line-height:1;}
.g-dir{font-size:28px;font-weight:900;letter-spacing:1px;}
.g-msg{font-size:14px;font-weight:700;line-height:1.5;}
.g-remain{font-size:12px;color:#aaa;margin-top:2px;}
.circ-wrap{position:relative;width:120px;height:120px;flex-shrink:0;}
.circ-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.circ-time{font-size:24px;font-weight:900;color:#5a1fa0;}
.circ-lbl{font-size:10px;color:#ccc;}
.ctrl-row{display:flex;gap:8px;justify-content:center;}
.btn-tog{padding:10px 26px;border-radius:50px;border:none;font-size:14px;font-weight:800;cursor:pointer;}
.btn-rst{padding:10px 14px;border-radius:50px;background:#fff;font-size:14px;font-weight:700;cursor:pointer;}
.mbox{background:#fff;border-radius:14px;padding:14px;margin-top:10px;}
.mbox-title{font-size:13px;font-weight:700;color:#555;margin-bottom:8px;}
.mrow{display:flex;align-items:center;gap:6px;margin-bottom:10px;}
.minput{flex:1;padding:9px 12px;border-radius:10px;border:2px solid #ffc0d8;font-size:20px;font-weight:800;color:#ff6b9d;}
.munit{font-size:14px;font-weight:700;color:#888;}
#done-banner{background:linear-gradient(135deg,#a8e6cf,#56ccf2);border-radius:18px;padding:18px;text-align:center;color:#fff;}
.hcard{background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:10px;}
.hdate{font-weight:800;color:#5a1fa0;font-size:14px;}
.hall{font-size:11px;background:#e8f5e9;color:#4caf50;padding:2px 9px;border-radius:16px;font-weight:700;float:right;}
.hrow{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:10px;margin-top:6px;}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.scard{background:#fff;border-radius:16px;padding:16px 12px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06);border:2px solid #ede0ff;}
.s-ico{font-size:28px;}.s-val{font-size:20px;font-weight:800;color:#5a1fa0;}.s-lbl{font-size:11px;color:#aaa;margin-top:1px;}
.empty{text-align:center;padding:40px;color:#ccc;font-size:14px;}
.timer-area{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;}
</style>
</head>
<body>
<div id="app">
  <div id="hdr">
    <div id="hdr-sub">🦷 歯列矯正トレーニング</div>
    <div id="hdr-title">毎日がんばろう！</div>
    <div id="prog-box">
      <div id="prog-date"></div>
      <div id="prog-row">
        <div id="prog-bg"><div id="prog-fill"></div></div>
        <span id="prog-txt">0/2</span>
      </div>
    </div>
  </div>
  <div id="tabs">
    <button class="tb on" onclick="showTab('today',this)">📋 きょう</button>
    <button class="tb"    onclick="showTab('history',this)">📅 きろく</button>
    <button class="tb"    onclick="showTab('stats',this)">📊 せいせき</button>
  </div>
  <div id="content">
    <div id="tab-today"   class="panel"></div>
    <div id="tab-history" class="panel" style="display:none"></div>
    <div id="tab-stats"   class="panel" style="display:none"></div>
  </div>
</div>

<script>
// ===== 音声 =====
var audioCtx = null;
function getAudioCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}
function beep(freq, dur, vol){
  try{
    var ctx = getAudioCtx();
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = freq||880;
    osc.type = "sine";
    gain.gain.setValueAtTime(vol||0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+(dur||0.15));
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime+(dur||0.15));
  }catch(e){}
}
function beepSwitch(){ beep(880, 0.12, 0.3); }
function beepDone(){ beep(880,0.12,0.3); setTimeout(function(){beep(1100,0.2,0.35);},180); }

var SKEY = "ortho2";
var rec = {};
try { rec = JSON.parse(localStorage.getItem(SKEY)||"{}"); } catch(e){}
function save(){ try{ localStorage.setItem(SKEY,JSON.stringify(rec)); }catch(e){} }
function todayStr(){
  var d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function todayRec(){ return rec[todayStr()]||{}; }
function setTodayRec(k,v){ if(!rec[todayStr()])rec[todayStr()]={};rec[todayStr()][k]=v;save(); }

// シーケンス
function makeTSeq(){
  var s=[{type:"tip",dur:3,msg:"口をリラックスして<br>準備してね",em:"😊"}];
  for(var i=0;i<20;i++){
    s.push({type:"up",dur:5,msg:"べろを上あごに<br>ぴったりつけて！",em:"👅"});
    s.push({type:"rest",dur:3,msg:"ストップ！<br>リラックス〜",em:"😌"});
  }
  s.push({type:"tip",dur:17,msg:"おつかれさま！<br>よくがんばったね🎉",em:"🌟"});
  return s;
}
var DIRS=[
  {label:"まえ",em:"⬆️",msg:"まっすぐ前に！<br>キープ！！",col:"#ff6b9d"},
  {label:"みぎ",em:"➡️",msg:"右に引っ張って！<br>キープ！！",col:"#ff9f43"},
  {label:"ひだり",em:"⬅️",msg:"左に引っ張って！<br>キープ！！",col:"#54a0ff"},
  {label:"うえ",em:"🔼",msg:"上に引っ張って！<br>キープ！！",col:"#5f27cd"},
  {label:"した",em:"🔽",msg:"下に引っ張って！<br>キープ！！",col:"#00d2d3"}
];
function makeLSeq(){
  var s=[{type:"tip",dur:3,msg:"リットレメーターを<br>くわえて準備！",em:"💪",col:"#ff6b9d"}];
  var e=3,di=0;
  while(e<163){
    var d=DIRS[di%5];
    s.push({type:"hold",dur:10,msg:d.msg,em:d.em,label:d.label,col:d.col});
    e+=10; if(e>=163)break;
    s.push({type:"rest",dur:3,msg:"すこし休憩〜",em:"😮‍💨",col:"#aaa"});
    e+=3; di++;
  }
  s.push({type:"tip",dur:17,msg:"おつかれさま！<br>計測値を入力してね📊",em:"🎉",col:"#4caf50"});
  return s;
}
var TSEQ=makeTSeq(), LSEQ=makeLSeq();

// タブ
function showTab(id,btn){
  ["today","history","stats"].forEach(function(t){
    document.getElementById("tab-"+t).style.display="none";
  });
  document.getElementById("tab-"+id).style.display="flex";
  document.querySelectorAll(".tb").forEach(function(b){b.classList.remove("on");});
  btn.classList.add("on");
  if(id==="history")renderHistory();
  if(id==="stats")renderStats();
}

// ヘッダー
function updateHeader(){
  var r=todayRec();
  var cnt=(r.lip&&r.lip.done?1:0)+(r.tongue&&r.tongue.done?1:0);
  var d=new Date();
  document.getElementById("prog-date").textContent=
    "きょうの進捗 ("+d.getFullYear()+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+String(d.getDate()).padStart(2,"0")+")";
  document.getElementById("prog-fill").style.width=(cnt/2*100)+"%";
  document.getElementById("prog-txt").textContent=cnt+"/2";
}

// タイマー状態
var lipState   = {elapsed:0,running:false,finished:false,saved:0,startTs:0,raf:null,seq:null,accent:"",onDone:null,lastStep:-1};
var tongState  = {elapsed:0,running:false,finished:false,saved:0,startTs:0,raf:null,seq:null,accent:"",onDone:null,lastStep:-1};

function initTimer(st,seq,accent,onDone){
  if(st.raf)cancelAnimationFrame(st.raf);
  st.elapsed=0; st.running=false; st.finished=false; st.saved=0; st.lastStep=-1;
  st.seq=seq; st.accent=accent; st.onDone=onDone;
}

function getStep(st){
  var acc=0,seq=st.seq;
  for(var i=0;i<seq.length;i++){
    if(acc+seq[i].dur>st.elapsed)return{s:seq[i],se:st.elapsed-acc};
    acc+=seq[i].dur;
  }
  var last=seq[seq.length-1];
  return{s:last,se:last.dur};
}

function totalTime(st){
  var t=0; st.seq.forEach(function(x){t+=x.dur;}); return t;
}

function renderTimer(st,wrapId,afterFn){
  var wrap=document.getElementById(wrapId);
  if(!wrap)return;
  var total=totalTime(st);
  var gs=getStep(st); var s=gs.s; var se=gs.se;
  var srem=s.dur-se;
  var trem=total-st.elapsed;
  var mins=Math.floor(trem/60);
  var secs=trem%60;
  var pct=st.elapsed/total;
  var R=50,circ=2*Math.PI*R;
  var off=circ*(1-pct);
  var bgc=s.col||st.accent;
  var isRest=s.type==="rest";
  var stroke=st.finished?"#4caf50":st.accent;

  var html='<div class="timer-area">';
  html+='<div class="guide" style="background:'+(isRest?"#f0fff4":bgc+"18")+';border:2.5px solid '+(isRest?"#a8e6a8":bgc+"55")+'">';
  html+='<div class="g-emoji">'+s.em+'</div>';
  if(s.label)html+='<div class="g-dir" style="color:'+bgc+'">'+s.label+'</div>';
  html+='<div class="g-msg" style="color:'+(isRest?"#4caf50":"#444")+'">'+s.msg+'</div>';
  if(s.type!=="tip")html+='<div class="g-remain">のこり '+srem+'秒</div>';
  html+='</div>';

  html+='<div class="circ-wrap"><svg width="120" height="120">';
  html+='<circle cx="60" cy="60" r="'+R+'" fill="none" stroke="#ede0ff" stroke-width="9"/>';
  html+='<circle cx="60" cy="60" r="'+R+'" fill="none" stroke="'+stroke+'" stroke-width="9" stroke-dasharray="'+circ+'" stroke-dashoffset="'+off+'" stroke-linecap="round" transform="rotate(-90 60 60)"/>';
  html+='</svg><div class="circ-center">';
  if(st.finished)html+='<span style="font-size:32px">✅</span>';
  else html+='<span class="circ-time">'+mins+':'+String(secs).padStart(2,"0")+'</span><span class="circ-lbl">のこり</span>';
  html+='</div></div>';

  if(!st.finished){
    var tbg=st.running?"#ffe0ef":"linear-gradient(135deg,"+st.accent+","+st.accent+"bb)";
    var tc=st.running?st.accent:"#fff";
    var tlbl=st.running?"⏸ 一時停止":(st.elapsed===0?"▶ スタート":"▶ 再開");
    html+='<div class="ctrl-row">';
    html+='<button class="btn-tog" style="background:'+tbg+';color:'+tc+'" onclick="toggleTimer(\''+wrapId+'\')">'+tlbl+'</button>';
    html+='<button class="btn-rst" style="border:2px solid '+st.accent+'44;color:'+st.accent+'" onclick="resetTimer(\''+wrapId+'\')">🔄</button>';
    html+='</div>';
  }
  html+='</div>';
  wrap.innerHTML=html;

  if(st.finished && afterFn) afterFn();
}

function toggleTimer(wrapId){
  var st=wrapId==="lip-timer"?lipState:tongState;
  if(st.running){
    st.saved=st.elapsed; st.running=false;
    if(st.raf)cancelAnimationFrame(st.raf);
    renderTimer(st,wrapId,null);
  } else {
    try{ getAudioCtx().resume(); }catch(e){}
    st.running=true;
    st.startTs=performance.now()-st.saved*1000;
    tickTimer(st,wrapId);
  }
}

function resetTimer(wrapId){
  var st=wrapId==="lip-timer"?lipState:tongState;
  if(st.raf)cancelAnimationFrame(st.raf);
  st.elapsed=0; st.running=false; st.finished=false; st.saved=0;
  renderTimer(st,wrapId,null);
}

function tickTimer(st,wrapId){
  var total=totalTime(st);
  var e=Math.floor((performance.now()-st.startTs)/1000);
  if(e>=total){
    st.elapsed=total; st.running=false; st.finished=true;
    beepDone();
    renderTimer(st,wrapId,st.onDone);
  } else {
    st.elapsed=e;
    // ステップが切り替わったら音を鳴らす
    var gs=getStep(st);
    var curStepIdx=0, acc=0;
    for(var i=0;i<st.seq.length;i++){
      if(acc+st.seq[i].dur>st.elapsed){curStepIdx=i;break;}
      acc+=st.seq[i].dur; curStepIdx=i;
    }
    if(st.lastStep!==-1 && curStepIdx!==st.lastStep) beepSwitch();
    st.lastStep=curStepIdx;
    renderTimer(st,wrapId,null);
    st.raf=requestAnimationFrame(function(){tickTimer(st,wrapId);});
  }
}

// リップカード
function renderLip(){
  var el=document.getElementById("c-lip"); if(!el)return;
  var r=todayRec().lip;
  var col="#ff6b9d";
  if(r&&r.done){
    el.innerHTML='<div class="card" style="background:#f6fff6;border:2px solid #a8e6a8">'+
      '<div class="badge">✅ 完了！</div>'+
      '<div class="c-head"><span class="c-ico">💪</span><div>'+
      '<div class="c-name" style="color:'+col+'">リットレメーター</div>'+
      '<div class="c-desc">くちびるの力を鍛える · 3分間</div></div></div>'+
      '<div class="done-box">⏰ 完了時刻：<strong>'+r.time+'</strong><br>'+
      '<span style="display:block;margin-top:4px">📊 計測値：<strong style="color:'+col+';font-size:18px">'+r.measure+' kg</strong></span>'+
      '<button class="redo" onclick="clearRec(\'lip\')">やり直す</button></div></div>';
    return;
  }
  el.innerHTML='<div class="card" style="background:#fff0f5;border:2px solid '+col+'44">'+
    '<div class="c-head"><span class="c-ico">💪</span><div>'+
    '<div class="c-name" style="color:'+col+'">リットレメーター</div>'+
    '<div class="c-desc">くちびるの力を鍛える · 3分間</div></div></div>'+
    '<button class="btn-start" style="background:linear-gradient(135deg,'+col+','+col+'cc)" onclick="startLip()">▶ トレーニング開始！</button>'+
    '</div>';
}

function startLip(){
  var el=document.getElementById("c-lip"); if(!el)return;
  var col="#ff6b9d";
  el.innerHTML='<div class="card" style="background:#fff0f5;border:2px solid '+col+'44">'+
    '<div class="c-head"><span class="c-ico">💪</span><div>'+
    '<div class="c-name" style="color:'+col+'">リットレメーター</div>'+
    '<div class="c-desc">くちびるの力を鍛える · 3分間</div></div></div>'+
    '<div id="lip-timer"></div>'+
    '<div id="lip-after"></div>'+
    '</div>';
  initTimer(lipState,LSEQ,col,function(){
    document.getElementById("lip-after").innerHTML=
      '<div class="mbox">'+
      '<div class="mbox-title">🎉 お疲れさま！計測値を入力してね</div>'+
      '<div class="mrow"><input class="minput" type="number" step="0.1" min="0" id="lip-m" placeholder="例: 0.8"/><span class="munit">kg</span></div>'+
      '<button class="btn-save" id="lip-sv" style="background:#ddd" onclick="saveLip()">✅ 記録する！</button>'+
      '</div>';
    document.getElementById("lip-m").oninput=function(){
      var sv=document.getElementById("lip-sv");
      sv.style.background=this.value?"#4caf50":"#ddd";
    };
  });
  renderTimer(lipState,"lip-timer",null);
}

function saveLip(){
  var v=document.getElementById("lip-m"); if(!v||!v.value)return;
  setTodayRec("lip",{done:true,measure:v.value,time:new Date().toTimeString().slice(0,5)});
  renderToday();
}

// アゲローカード
function renderTongue(){
  var el=document.getElementById("c-tongue"); if(!el)return;
  var r=todayRec().tongue;
  var col="#ff9f43";
  if(r&&r.done){
    el.innerHTML='<div class="card" style="background:#f6fff6;border:2px solid #a8e6a8">'+
      '<div class="badge">✅ 完了！</div>'+
      '<div class="c-head"><span class="c-ico">👅</span><div>'+
      '<div class="c-name" style="color:'+col+'">アゲローくん</div>'+
      '<div class="c-desc">舌の力を鍛える · 3分間</div></div></div>'+
      '<div class="done-box">⏰ 完了時刻：<strong>'+r.time+'</strong>'+
      '<button class="redo" onclick="clearRec(\'tongue\')" style="display:block;margin-top:8px">やり直す</button></div></div>';
    return;
  }
  el.innerHTML='<div class="card" style="background:#fffaf0;border:2px solid '+col+'44">'+
    '<div class="c-head"><span class="c-ico">👅</span><div>'+
    '<div class="c-name" style="color:'+col+'">アゲローくん</div>'+
    '<div class="c-desc">舌の力を鍛える · 3分間</div></div></div>'+
    '<button class="btn-start" style="background:linear-gradient(135deg,'+col+','+col+'cc)" onclick="startTongue()">▶ トレーニング開始！</button>'+
    '</div>';
}

function startTongue(){
  var el=document.getElementById("c-tongue"); if(!el)return;
  var col="#ff9f43";
  el.innerHTML='<div class="card" style="background:#fffaf0;border:2px solid '+col+'44">'+
    '<div class="c-head"><span class="c-ico">👅</span><div>'+
    '<div class="c-name" style="color:'+col+'">アゲローくん</div>'+
    '<div class="c-desc">舌の力を鍛える · 3分間</div></div></div>'+
    '<div id="tong-timer"></div>'+
    '<div id="tong-after"></div>'+
    '</div>';
  initTimer(tongState,TSEQ,col,function(){
    document.getElementById("tong-after").innerHTML=
      '<button class="btn-save" style="background:#4caf50;box-shadow:0 4px 12px rgba(76,175,80,.4)" onclick="saveTongue()">✅ きょうの記録をつける！</button>';
  });
  renderTimer(tongState,"tong-timer",null);
}

function saveTongue(){
  setTodayRec("tongue",{done:true,time:new Date().toTimeString().slice(0,5)});
  renderToday();
}

function clearRec(k){
  if(rec[todayStr()])delete rec[todayStr()][k];
  save(); renderToday();
}

function renderToday(){
  updateHeader();
  var r=todayRec();
  var cnt=(r.lip&&r.lip.done?1:0)+(r.tongue&&r.tongue.done?1:0);
  var el=document.getElementById("tab-today");
  el.innerHTML="";
  if(cnt===2){
    var b=document.createElement("div");
    b.id="done-banner";
    b.innerHTML='<div style="font-size:38px">🎉</div><div style="font-size:18px;font-weight:800;margin-top:4px">きょうのトレーニング完了！</div><div style="font-size:13px;opacity:.9;margin-top:4px">えらい！きれいな歯並びに近づいてるよ💪</div>';
    el.appendChild(b);
  }
  var lc=document.createElement("div"); lc.id="c-lip";
  var tc=document.createElement("div"); tc.id="c-tongue";
  el.appendChild(lc); el.appendChild(tc);
  renderLip(); renderTongue();
}

function renderHistory(){
  var el=document.getElementById("tab-history"); el.innerHTML="";
  var days=Object.keys(rec).sort(function(a,b){return b>a?1:-1;}).slice(0,30);
  if(!days.length){el.innerHTML='<div class="empty">まだ記録がないよ😊<br>トレーニングしたら記録してね！</div>';return;}
  days.forEach(function(day){
    var dr=rec[day]||{};
    var all=dr.lip&&dr.lip.done&&dr.tongue&&dr.tongue.done;
    var h='<div class="hcard" style="border:2px solid '+(all?"#a8e6a8":"#ede0ff")+'">';
    h+='<div><span class="hdate">📅 '+day.replace(/-/g,"/")+'</span>'+(all?'<span class="hall">全完了⭐</span>':'')+'</div>';
    [{label:"アゲローくん",em:"👅",r:dr.tongue,col:"#ff9f43"},
     {label:"リットレメーター",em:"💪",r:dr.lip,col:"#ff6b9d",unit:"kg"}].forEach(function(x){
      h+='<div class="hrow" style="background:'+(x.r&&x.r.done?"#f6fff6":"#fff5f5")+'">';
      h+='<span style="font-size:18px">'+x.em+'</span>';
      h+='<div style="flex:1;font-weight:700;font-size:12px;color:#555">'+x.label;
      if(x.r&&x.r.measure)h+='<span style="margin-left:6px;color:'+x.col+';font-weight:800;font-size:13px">'+x.r.measure+(x.unit||"")+'</span>';
      h+='</div><span style="font-size:16px">'+(x.r&&x.r.done?"✅":"❌")+'</span></div>';
    });
    h+='</div>';
    el.innerHTML+=h;
  });
}

function renderStats(){
  var el=document.getElementById("tab-stats"); el.innerHTML="";
  var days=Object.keys(rec);
  var perfect=days.filter(function(d){return rec[d].lip&&rec[d].lip.done&&rec[d].tongue&&rec[d].tongue.done;}).length;
  var ms=days.map(function(d){return parseFloat((rec[d].lip||{}).measure);}).filter(function(v){return !isNaN(v);});
  var maxL=ms.length?Math.max.apply(null,ms):null;
  var latL=ms.length?ms[ms.length-1]:null;
  var sorted=days.slice().sort(function(a,b){return b>a?1:-1;});
  var streak=0;
  for(var i=0;i<sorted.length;i++){var dr=rec[sorted[i]];if(dr.lip&&dr.lip.done&&dr.tongue&&dr.tongue.done)streak++;else break;}
  var stats=[
    {em:"📅",val:days.length+"日",lbl:"記録した日数"},
    {em:"⭐",val:perfect+"日",lbl:"全完了の日"},
    {em:"🔥",val:streak+"日",lbl:"連続完了"},
    {em:"🏆",val:maxL?maxL+"kg":"-",lbl:"リットレ最高値"},
    {em:"📊",val:latL?latL+"kg":"-",lbl:"リットレ最新値"},
  ];
  var h='<div class="sgrid">';
  stats.forEach(function(s){h+='<div class="scard"><div class="s-ico">'+s.em+'</div><div class="s-val">'+s.val+'</div><div class="s-lbl">'+s.lbl+'</div></div>';});
  h+='</div>';
  el.innerHTML=h;
}

renderToday();
</script>
